name: Build and deploy

on:
  push:
    paths-ignore:
      - 'independence/**'
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.pages.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Publish the default branch once the repository has Pages turned on (Settings, Pages, Source:
      # GitHub Actions). Until then the build still gets checked, and the run says why nothing went out.
      - id: pages
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Not published::GitHub Pages isn't turned on for this repository. Turn it on under Settings, Pages, Source: GitHub Actions, then push or run this workflow again."
          fi
      - if: steps.pages.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - if: steps.pages.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Only the default branch is published; every other branch just gets checked.
  deploy:
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
