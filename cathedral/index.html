<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161a24">
<title>Cathedral Builder</title>
<style>
:root {
  --bg: #161a24; --bg2: #1f2533; --panel: #262d3e; --ink: #e8e4da; --dim: #9aa0b0;
  --accent: #e0b866; --good: #8fcf9b; --stone: #b8ad98;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
  font: 16px/1.4 system-ui, -apple-system, 'Segoe UI', sans-serif; overscroll-behavior: none; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
#app { max-width: 560px; height: 100dvh; margin: 0 auto; display: flex; flex-direction: column;
  padding: env(safe-area-inset-top) 12px env(safe-area-inset-bottom); }
.hidden { display: none !important; }

/* header */
header { display: flex; align-items: center; gap: 8px; padding: 10px 0 6px; min-height: 56px; }
header h1 { flex: 1; margin: 0; font-size: 1.05rem; font-weight: 600; letter-spacing: .02em; }
header h1 small { display: block; font-weight: 400; font-size: .78rem; color: var(--dim); }
.btn { background: var(--panel); border: 1px solid #343c52; border-radius: 12px; padding: 8px 14px; min-height: 44px; }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #231b08; border-color: var(--accent); font-weight: 600; }
.btn.icon { min-width: 44px; padding: 8px; }

/* home */
#home { flex: 1; overflow-y: auto; padding-bottom: 20px; }
#home h1 { font-size: 1.5rem; margin: 18px 0 2px; }
#home p.lead { color: var(--dim); margin: 0 0 16px; }
.card { display: flex; gap: 14px; align-items: center; width: 100%; text-align: left; margin: 0 0 12px;
  background: var(--panel); border: 1px solid #343c52; border-radius: 16px; padding: 12px; }
.card svg { flex: none; width: 92px; height: 112px; border-radius: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.chip { background: #333b50; border: 1px solid #45506c; border-radius: 99px; padding: 6px 12px; min-height: 36px; font-size: .82rem; }
.chip.done { background: #27412f; border-color: #3b6a49; color: var(--good); }
.chip:disabled { opacity: .5; cursor: default; }
#tray.nolabels { grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); grid-auto-rows: 70px; }
.card .t { font-weight: 600; }
.card .s { color: var(--dim); font-size: .85rem; }
.tag { display: inline-block; margin-top: 4px; font-size: .78rem; padding: 2px 8px; border-radius: 99px; background: #333b50; color: var(--dim); }
.tag.done { background: #27412f; color: var(--good); }

/* play */
#play { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#coach { min-height: 44px; display: flex; align-items: center; justify-content: center; text-align: center;
  color: var(--ink); padding: 2px 4px; transition: opacity .25s; }
#coach.fade { opacity: 0; }
#stage { flex: 1; min-height: 0; position: relative; }
#stage svg { width: 100%; height: 100%; display: block; }
#offer { display: flex; gap: 8px; align-items: center; justify-content: space-between; background: var(--panel);
  border: 1px solid #343c52; border-radius: 12px; padding: 8px 10px; margin: 6px 0; }
#offer span { flex: 1; font-size: .92rem; }
#offer .btn { min-height: 38px; padding: 4px 12px; }
#tray { height: 30dvh; max-height: 280px; min-height: 140px; overflow-y: auto; margin-top: 4px; padding: 6px;
  background: var(--bg2); border-radius: 16px; display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
  grid-auto-rows: 82px; gap: 6px; align-content: start; }
.item { position: relative; background: var(--panel); border: 2px solid transparent; border-radius: 12px; padding: 4px 2px 0;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; overflow: hidden; }
.item svg { width: 100%; flex: 1; min-height: 0; }
.item .n { font-size: .62rem; line-height: 1.1; color: var(--dim); text-align: center; padding: 1px 2px 4px; }
.item.sel { border-color: var(--accent); background: #353b50; transform: translateY(-2px); }
.item.hinted { animation: glow 1.1s ease-in-out infinite; border-color: var(--good); }
.item.shake { animation: shake .4s; }
.item.wobble { animation: wobble .6s; }
.item.gone { animation: gone .25s forwards; }
@keyframes glow { 50% { box-shadow: 0 0 14px 2px rgba(143,207,155,.55); } }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(5px); } 60% { transform: translateX(-3px); } }
@keyframes wobble { 15% { transform: rotate(-9deg); } 35% { transform: rotate(8deg); } 55% { transform: rotate(-5deg); } 75% { transform: rotate(3deg); } }
@keyframes gone { to { opacity: 0; transform: scale(.7); } }

/* stone drawing */
.body { fill: var(--tone); }
.edge { fill: none; stroke: rgba(15,12,8,.55); stroke-width: .8; stroke-linejoin: round; pointer-events: none; }
.courses, .shade { pointer-events: none; }
.glass .body { fill: url(#glass); }
.glass .edge { stroke: rgba(10,10,20,.8); stroke-width: 1.2; }
.mark { fill: none; stroke: rgba(255,255,255,.28); stroke-width: 1.4; }
.mark.dark { stroke: rgba(20,22,30,.7); stroke-width: 2.6; }
.sil .body { fill: #fff; opacity: .06; stroke: none; }
.sil .marks { display: none; }
.tray-dummy {}
.slotbox { fill: rgba(224,184,102,.05); stroke: rgba(224,184,102,.55); stroke-width: 1.2; stroke-dasharray: 4 3; opacity: 0; transition: opacity .2s; pointer-events: none; }
.has-sel .slotbox { opacity: 1; }
.placed { animation: drop .28s ease-out; }
@keyframes drop { from { transform: translateY(-10px); opacity: .3; } to { transform: none; opacity: 1; } }
.bounce { animation: bounceBox .4s; }
@keyframes bounceBox { 25% { transform: translateX(-3px); } 50% { transform: translateX(3px); } 75% { transform: translateX(-1px); } }
.glowrect { fill: #ffc86b; opacity: 0; transition: opacity 1.6s ease 1.1s; }
.lit .glowrect { opacity: .8; }
.piece .body { transition: fill .8s, filter .8s; }
.lit .piece.warm .body { filter: brightness(1.12); }
.lit .piece.glass .body { fill: #ffd98a; filter: drop-shadow(0 0 5px #ffb84d); }
.link { stroke: var(--good); stroke-width: 2; stroke-dasharray: 5 4; fill: none; animation: fadeout 1.8s forwards; pointer-events: none; }
.pulse { fill: rgba(143,207,155,.25); stroke: var(--good); stroke-width: 1.5; animation: fadeout 1.8s forwards; pointer-events: none; }
@keyframes fadeout { 60% { opacity: 1; } to { opacity: 0; } }

/* modals */
.modal { position: fixed; inset: 0; background: rgba(8,10,16,.72); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.sheet { background: var(--panel); border: 1px solid #3a4360; border-radius: 20px; padding: 20px; max-width: 460px; width: 100%; max-height: 86dvh; overflow-y: auto; }
.sheet h2 { margin: 0; font-size: 1.3rem; }
.sheet .kick { color: var(--accent); font-size: .85rem; margin-bottom: 10px; }
.sheet ul { padding-left: 18px; margin: 10px 0 16px; }
.sheet li { margin-bottom: 8px; }
.sheet .row { display: flex; gap: 8px; flex-wrap: wrap; }
.sheet .row .btn { flex: 1; }
.badge { display: inline-block; padding: 4px 12px; border-radius: 99px; background: #27412f; color: var(--good); margin: 8px 0; }
.badge.plain { background: #333b50; color: var(--ink); }
.unverified { font-size: .75rem; color: var(--dim); margin: -6px 0 14px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="btn icon hidden" id="back" aria-label="Back to cathedrals">&larr;</button>
    <h1 id="title">Cathedral Builder<small>Working title</small></h1>
    <button class="btn icon hidden" id="about" aria-label="About this cathedral">i</button>
    <button class="btn icon hidden" id="hint" aria-label="Hint">Hint</button>
    <button class="btn icon" id="mute" aria-label="Sound">&#128266;</button>
  </header>

  <section id="home"></section>

  <section id="play" class="hidden">
    <div id="coach"></div>
    <div id="stage"></div>
    <div id="offer" class="hidden">
      <span>Stuck? I can point out the next piece.</span>
      <button class="btn primary" id="offerYes">Show me</button>
      <button class="btn" id="offerNo">Not now</button>
    </div>
    <div id="tray"></div>
  </section>
</div>
<div id="modal" class="modal hidden"></div>

<script src="rules.js"></script>
<script src="data/shapes.js"></script>
<script src="data/durham.js"></script>
<script src="data/salisbury.js"></script>
<script src="data/notredame.js"></script>
<script src="game.js"></script>
</body>
</html>
